<div class="transactions-container">
  <h2>{{ vars.user?.fullName || vars.maskedUser?.fullName }} - Transactions</h2>

  <div class="transactions-list">
    @if (transactions.length > 0) {
      @for (txn of transactions; track txn.id) {
        <div class="transaction-item" [class.credit]="txn.type === 'credit'" [class.debit]="txn.type === 'debit'">
          <div class="txn-date">{{ txn.date | date:'medium' }}</div>
          <div class="txn-amount">{{ txn.amount | currency }}</div>
          <div class="txn-type">{{ txn.type }}</div>
        </div>
      }
    } @else {
      <div class="no-transactions">
        No transactions found for this user.
      </div>
    }
  </div>
</div>
